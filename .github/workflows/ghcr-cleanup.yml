name: GHCR Cleanup

on:
  schedule:
    - cron: "15 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup-sail-images:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Sail fingerprint images, keep newest 3
        uses: snok/container-retention-policy@v3.0.1
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: erikgratz.com/sail-8.4
          image-tags: sail-*
          tag-selection: tagged
          keep-n-most-recent: "3"
          cut-off: 3650d
