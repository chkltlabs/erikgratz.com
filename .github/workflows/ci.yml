name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write
  issues: write
  pull-requests: write

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Compute Sail runtime fingerprint
        id: runtime
        run: |
          RUNTIME_HASH=$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C vendor/laravel/sail/runtimes/8.4 . | sha256sum | cut -c1-12)
          echo "runtime_hash=${RUNTIME_HASH}" >> "$GITHUB_OUTPUT"
          echo "sail_runtime_image=ghcr.io/${{ github.repository }}/sail-8.4" >> "$GITHUB_OUTPUT"
          echo "SAIL_RUNTIME_IMAGE=ghcr.io/${{ github.repository }}/sail-8.4" >> "$GITHUB_ENV"
          echo "SAIL_RUNTIME_TAG=sail-${RUNTIME_HASH}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Build and push Sail runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/laravel/sail/runtimes/8.4
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.runtime.outputs.sail_runtime_image }}:sail-${{ steps.runtime.outputs.runtime_hash }}
          cache-from: type=registry,ref=${{ steps.runtime.outputs.sail_runtime_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.runtime.outputs.sail_runtime_image }}:buildcache,mode=max
          build-args: |
            WWWGROUP=1000
            WWWUSER=1000

      - name: Tag latest Sail runtime image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.runtime.outputs.sail_runtime_image }}:latest" \
            "${{ steps.runtime.outputs.sail_runtime_image }}:sail-${{ steps.runtime.outputs.runtime_hash }}"

      - name: Pull and start Docker Compose
        env:
          WWWGROUP: 1000
          WWWUSER: 1000
        run: |
          docker compose pull laravel.test
          docker compose up -d
          sleep 10

      - name: Install Dependencies
        run: docker compose exec -T laravel.test composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: docker compose exec -T laravel.test php artisan key:generate

      - name: Directory Permissions
        run: docker compose exec -T laravel.test chmod -R 777 storage bootstrap/cache

      - name: Wait for MySQL
        env:
          WWWGROUP: 1000
          WWWUSER: 1000
        run: |
          until docker compose exec -T mysql mysqladmin ping -p'password' --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
        timeout-minutes: 2

      - name: Run Migrations
        run: docker compose exec -T laravel.test php artisan migrate --force

      - name: Run Parallel Tests
        run: docker compose exec -T laravel.test php artisan test --parallel --processes=8 --coverage --coverage-cobertura=cobertura.xml

      - name: Get List of Changed Files in App Dir
        id: changed-files
        if: github.event_name == 'pull_request'
          && always() && !cancelled()
        uses: tj-actions/changed-files@v46.0.5
        with:
          path: 'app'
          files_ignore: 'Console/Kernel.php'
          # Avoid using single or double quotes for multiline patterns
          files: |
            **.php

      - name: Analyze Coverage of App Dir Files
        id: analyze
        if: github.event_name == 'pull_request'
          && steps.changed-files.outputs.all_changed_files_count != 0
          && always() && !cancelled()
        uses: chkltlabs/CodeCoverageSummary@v2
        with:
          filename: cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          prfiles: " ${{ steps.changed-files.outputs.all_changed_files }} "
          thresholds: '80 90'

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
          && steps.changed-files.outputs.all_changed_files_count != 0
          && always() && !cancelled()
        uses: marocchino/sticky-pull-request-comment@v2.9.2
        with:
          hide_and_recreate: true
          hide_classify: 'OUTDATED'
          path: code-coverage-results.md
