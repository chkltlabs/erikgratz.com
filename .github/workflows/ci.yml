name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Restore prebuilt Docker image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/sail-8.4-app.tar
          key: ${{ runner.os }}-sail-84-image-${{ hashFiles('docker/8.4/**') }}

      - name: Load cached Docker image
        id: load-image
        if: steps.image-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: docker load --input /tmp/sail-8.4-app.tar

      - name: Set up Docker Buildx
        if: steps.image-cache.outputs.cache-hit != 'true' || steps.load-image.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.image-cache.outputs.cache-hit != 'true' || steps.load-image.outcome == 'failure'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/8.4/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Build Docker image
        if: steps.image-cache.outputs.cache-hit != 'true' || steps.load-image.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/8.4
          push: false
          load: true
          tags: sail-8.4/app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            WWWGROUP=1000
            WWWUSER=1000

      - name: Move cache
        if: steps.image-cache.outputs.cache-hit != 'true' || steps.load-image.outcome == 'failure'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Save Docker image to cache
        if: steps.image-cache.outputs.cache-hit != 'true' || steps.load-image.outcome == 'failure'
        run: docker save sail-8.4/app:latest --output /tmp/sail-8.4-app.tar

      - name: Start Docker Compose
        env:
          WWWGROUP: 1000
          WWWUSER: 1000
        run: |
          docker compose up -d --no-build
          sleep 10

      - name: Install Dependencies
        run: docker compose exec -T laravel.test composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: docker compose exec -T laravel.test php artisan key:generate

      - name: Directory Permissions
        run: docker compose exec -T laravel.test chmod -R 777 storage bootstrap/cache

      - name: Wait for MySQL
        env:
          WWWGROUP: 1000
          WWWUSER: 1000
        run: |
          until docker compose exec -T mysql mysqladmin ping -p'password' --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
        timeout-minutes: 2

      - name: Run Migrations
        run: docker compose exec -T laravel.test php artisan migrate --force

      - name: Run Tests
        run: |
          rm -f cobertura.xml
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker compose exec -T -e PHP_CLI_SERVER_WORKERS=1 laravel.test sh -c 'echo "memory_limit=512M" > /usr/local/etc/php/conf.d/ci-memory.ini && php artisan test --coverage --coverage-cobertura=cobertura.xml'
          else
            docker compose exec -T laravel.test php artisan test --parallel --processes=8
          fi

      - name: Get List of Changed Files in App Dir
        id: changed-files
        if: github.event_name == 'pull_request'
          && always() && !cancelled()
        uses: tj-actions/changed-files@v46.0.5
        with:
          path: 'app'
          files_ignore: 'Console/Kernel.php'
          files: |
            **.php

      - name: Analyze Coverage of App Dir Files
        id: analyze
        if: github.event_name == 'pull_request'
          && steps.changed-files.outputs.all_changed_files_count != 0
          && always() && !cancelled()
        uses: chkltlabs/CodeCoverageSummary@v2
        with:
          filename: cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          prfiles: " ${{ steps.changed-files.outputs.all_changed_files }} "
          thresholds: '80 90'

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
          && steps.changed-files.outputs.all_changed_files_count != 0
          && always() && !cancelled()
        uses: marocchino/sticky-pull-request-comment@v2.9.2
        with:
          hide_and_recreate: true
          hide_classify: 'OUTDATED'
          path: code-coverage-results.md
