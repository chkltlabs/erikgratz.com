; PHP-FPM reads this from the site public directory (PHP_INI_PERDIR).
; Forge's php.ini defaults are upload_max_filesize=2M and post_max_size=8M,
; so a 4.5MB admin photo never reaches Livewire.
; 12M matches Livewire's temporary upload rule (max:12288). post_max_size is larger
; so the multipart body fits. Nginx client_max_body_size must be at least this
; (see deploy/nginx/site-snippet.conf).
upload_max_filesize = 12M
post_max_size = 16M
