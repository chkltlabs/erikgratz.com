# OpenSSH keeps port 22. Forge is unchanged.
# A login that is not a real account resolves to group terminal, and OpenSSH
# starts Wish for it. forge and root are never in that group.
#
# Append "terminal" to the passwd line in /etc/nsswitch.conf:
#   passwd:         files systemd terminal

KbdInteractiveAuthentication no
PasswordAuthentication no
AllowUsers * forge root

Match Group terminal
	AuthenticationMethods keyboard-interactive
	KbdInteractiveAuthentication yes
	PermitEmptyPasswords yes
	PubkeyAuthentication no
	PasswordAuthentication no
	ForceCommand /usr/local/bin/erikgratz-terminal-shell
	DisableForwarding yes
	PermitTTY yes
	PermitUserRC no
	X11Forwarding no
